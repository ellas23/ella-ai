<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ella — Status</title>
  <style>
    body{font-family:Segoe UI,system-ui,Arial;background:#071018;color:#dff6ff;margin:0;padding:18px}
    h1{margin:0 0 12px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03);text-align:left}
    button{padding:6px 8px;border-radius:6px;border:0;background:#2b82a8;color:white;cursor:pointer}
    pre{background:#041220;padding:12px;border-radius:8px;overflow:auto}
    .small{font-size:12px;color:#9fb4d9}
  </style>
</head>
<body>
  <h1>Ella — Connected Clients</h1>
  <div class="small">This page shows WebSocket clients connected to the backend. Use <strong>Disconnect</strong> to force-terminate a client.</div>
  <div style="height:12px"></div>
  <table id="clientsTable">
    <thead><tr><th>ID</th><th>Address</th><th>UA</th><th>Last Seen</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>

  <div style="height:18px"></div>
  <div id="detail"></div>

  <script>
    async function load() {
      const res = await fetch('/api/clients');
      const j = await res.json();
      const tbody = document.querySelector('#clientsTable tbody'); tbody.innerHTML = '';
      j.clients.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${c.id}</td><td>${c.addr}</td><td style="max-width:280px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${c.userAgent||''}</td><td>${new Date(c.lastSeen).toLocaleString()}</td><td></td>`;
        const actions = tr.querySelector('td:last-child');
        const view = document.createElement('button'); view.textContent = 'View HELLO'; view.style.marginRight='8px'; view.onclick = () => showDetail(c);
        const kick = document.createElement('button'); kick.textContent = 'Disconnect'; kick.style.background='#f44e7a'; kick.onclick = () => disconnect(c.id);
        actions.appendChild(view); actions.appendChild(kick);
        tbody.appendChild(tr);
      });
    }
    function showDetail(c) {
      const el = document.getElementById('detail');
      el.innerHTML = `<h3>Client ${c.id}</h3><div class="small">Address: ${c.addr}</div><div style="height:8px"></div><pre>${JSON.stringify(c.lastClientHello || c, null, 2)}</pre>`;
    }
    async function disconnect(id) {
      if (!confirm('Disconnect client ' + id + '?')) return;
      const res = await fetch(`/api/clients/${id}/disconnect`, { method: 'POST' });
      if (res.ok) { alert('Disconnected'); load(); } else { alert('Failed'); }
    }
    load();
    setInterval(load, 4000);
  </script>
</body>
</html>
