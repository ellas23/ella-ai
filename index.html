<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ella</title>
<style>
  html,body{margin:0;height:100%;background:#02040a;overflow:hidden;font-family:'Segoe UI',sans-serif;}
/* stage is tucked to the bottom-right when idle, expands when awake */
#stage{position:fixed;right:18px;bottom:18px;width:120px;height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:all 260ms cubic-bezier(.2,.9,.2,1);overflow:visible}
#stage.awake{right:50%;bottom:50%;transform:translate(50% ,50%);width:640px;height:640px;border-radius:18px}
canvas{position:absolute;inset:0;width:100%;height:100%;}
#stateLabel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#7fe6ff;font-family:'Consolas',monospace;font-size:13px;letter-spacing:.3em;opacity:.85;}
#transcript{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);width:70%;text-align:center;color:#cfe9ff;font-family:'Consolas',monospace;font-size:14px;opacity:0;transition:opacity .4s ease;}
  #transcript.show{opacity:1;}
  #camPreview{position:absolute;bottom:12px;right:12px;width:1px;height:1px;opacity:0;} /* hidden, gesture-tracking only */
  #configBadge{position:absolute;top:10px;left:12px;color:#3a4a5c;font-family:'Consolas',monospace;font-size:10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="orbCanvas" width="700" height="700"></canvas>
  <div id="stateLabel">STANDBY</div>
  <div id="transcript"></div>
  <video id="camPreview" autoplay muted playsinline></video>
  <div id="configBadge" id="configBadge"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="orb-config.js"></script>
<script src="orb.js"></script>
</body>
</html>
