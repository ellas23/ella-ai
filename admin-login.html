<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ella Admin Login</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8f0ff;font:16px system-ui,sans-serif}
    main{width:min(420px,calc(100% - 32px));padding:28px;border:1px solid #31506d;border-radius:16px;background:#101d31;box-sizing:border-box}
    h1{margin-top:0} label{display:grid;gap:8px;color:#9db2c9} input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #31506d;box-sizing:border-box} input{width:100%;background:#08111f;color:#fff} button{margin-top:16px;background:#52d5ff;color:#07101c;font-weight:700;cursor:pointer;width:100%} #error{min-height:22px;color:#ff8c8c;margin-top:12px}
  </style>
</head>
<body><main><h1>Ella Command Center</h1><p>Admin authentication is required for remote access.</p><form id="login"><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><div id="error" role="alert"></div></form></main>
<script>
  document.getElementById('login').addEventListener('submit', async event => {
    event.preventDefault();
    const error = document.getElementById('error'); error.textContent = '';
    try {
      const response = await fetch('/api/auth/login?_=' + Date.now(), { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: {'Content-Type':'application/json', 'Cache-Control':'no-store'}, body: JSON.stringify({ password: document.getElementById('password').value }) });
      const responseText = await response.text();
      let data = {};
      try { data = responseText ? JSON.parse(responseText) : {}; } catch {}
      if (!response.ok) throw new Error(data.error || 'Authentication failed.');
      const session = await fetch('/api/auth/status?_=' + Date.now(), { credentials: 'same-origin', cache: 'no-store', headers: {'Cache-Control':'no-store'} });
      const sessionText = await session.text();
      let sessionData = {};
      try { sessionData = sessionText ? JSON.parse(sessionText) : {}; } catch {}
      if (!session.ok || !sessionData.authenticated) throw new Error('Login succeeded but the admin session was not saved.');
      location.replace('/dashboard.html');
    } catch (err) { error.textContent = err instanceof TypeError ? 'Ella bridge is temporarily unavailable. Please try again.' : err.message; }
  });
</script>
</body>
</html>
